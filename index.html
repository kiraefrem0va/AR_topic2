<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR-маска — очки и шляпа</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <a-scene
    mindar-face="filterMinCF: 0.0001; filterBeta: 1"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="headModel"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
      <a-asset-item id="glassesModel"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
      <a-asset-item id="hatModel"
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat/scene.gltf"></a-asset-item>
    </a-assets>

    <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Невидимая голова-окклюдер -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model mindar-face-occluder src="#headModel"
        position="0 -0.3 0.15" rotation="0 0 0" scale="0.065 0.065 0.065"></a-gltf-model>
    </a-entity>

    <!-- Очки на переносице -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model src="#glassesModel"
        position="0 -0.08 -0.1" rotation="0 0 0" scale="0.011 0.011 0.011"></a-gltf-model>
    </a-entity>

    <!-- Шляпа на лбу -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-gltf-model src="#hatModel"
        position="0 1.35 -0.5" rotation="0 0 0" scale="0.4 0.4 0.4"></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
